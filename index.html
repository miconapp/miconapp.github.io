<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>MicOn - Bebaskan Suaramu</title>
  <meta name="description" content="MicOn — Bebaskan Suaramu.">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#fff}
    #micon-frame{display:block;width:100%;height:100%;height:100dvh;border:0;margin:0;padding:0;background:#fff;position:relative;z-index:1}
    #micon-startup{position:fixed;inset:0;z-index:2;background:#006bc8 url("https://raw.githubusercontent.com/miconapp/miconapp.github.io/main/src/Splash%20Screen%20desktop.png") center/cover no-repeat;display:grid;place-items:end center;transition:opacity .18s ease,visibility .18s ease}
    #micon-startup::after{content:"Sedang Menyiapkan Sistem Mohon Tunggu";color:#fff;text-align:center;font:700 11px/1.5 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 8px #001b36;margin:0 15px 7vh}
    #micon-startup.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    @media(max-width:760px){#micon-startup{background-image:url("https://raw.githubusercontent.com/miconapp/miconapp.github.io/main/src/Splash%20Screen%20mobile.png")}}
  </style>
   <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8719595290097938"
     crossorigin="anonymous"></script>
</head>
<body>
  <div id="micon-startup" role="status" aria-label="Memuat MicOn"></div>
  <iframe id="micon-frame" title="MicOn" src="./micon.html" allow="autoplay; fullscreen;" allowfullscreen></iframe>
  <script>
    // Tutup lapisan awal setelah dokumen iframe selesai dimuat.
    // micon.html tetap menjalankan pengaman autentikasinya sendiri.
    const startupLayer = document.getElementById("micon-startup");
    const frame = document.getElementById("micon-frame");
    let finished = false;
    function finishStartup(){
      if(finished) return;
      finished = true;
      startupLayer?.classList.add("is-hidden");
      window.setTimeout(() => startupLayer?.remove(), 250);
    }
    window.addEventListener("message", event => {
      if(event.source === frame.contentWindow && event.origin === location.origin && event.data === "micon-auth-ready") finishStartup();
    });
    frame.addEventListener("load", () => {
      try {
        // Login memiliki splash screen sendiri; jangan tutupi halaman login.
        if(frame.contentWindow.location.pathname.endsWith("/login.html")) finishStartup();
      } catch (_) {}
    });
  </script>
</body>
</html>
